name: Security Verification
run-name: >-
    ${{
        github.event_name == 'pull_request'
        && format('Security Verification for CI: PR #{0} -> {1}', github.event.number, github.event.pull_request.title)
        ||
        github.event_name == 'push'
        && format('Security Verification for CI: Merge -> {0}', github.event.head_commit.message)
    }}

on:
    pull_request:
        types: [opened, synchronize, reopened]
    push:
        branches: ["main"]

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    security-ci-test:
        name: npm audit & Trivy
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
        - name: 📥 Git -- Checkout repository
          uses: actions/checkout@v7

        - name: 📘 Node -- Set up
          uses: actions/setup-node@v6
          with:
            node-version: '24'
            cache: npm

        - name: 📦 Node -- Install dependencies
          run: npm ci

        - name: 🧪 Node -- Test Vulnerability -> Modules
          run: |
            echo "⚙️ Running npm audit on production Node modules:"
            if npm audit --omit=dev --audit-level=moderate; then
                echo ""
                echo "✅ No vulnerabilities found in Node modules."
            else
                echo ""
                echo "❌ Vulnerabilities found in Node modules."
                exit 1
            fi

        - name: 🧪 Trivy -- Test Vuln, Secret, Misconfig -> File System
          uses: aquasecurity/trivy-action@v0.36.0
          with:
            scan-type: fs
            scan-ref: .
            ignore-unfixed: true
            scanners: vuln,secret,misconfig
            format: table
            severity: CRITICAL,HIGH,MEDIUM
            exit-code: '1'
