services:
  frontend-antiginx:
    image: ghcr.io/prawo-i-piesc/frontend-antiginx:latest
    container_name: frontend-antiginx
    restart: unless-stopped

    ports:
      - "${FRONTEND_PORT}:3000"

    environment:
      # Server-side only: resolved per request when proxying /api. Points at
      # the backend on the shared network, never at an address the browser
      # has to reach.
      - BACKEND_URL=${BACKEND_URL}

    networks:
      - vpn-net

networks:
  vpn-net:
    external: true